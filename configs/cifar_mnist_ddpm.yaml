# STE DDPM training: CIFAR-10 (primary) + MNIST (shadow @ offset 1000)
# Equivalent CLI:
#   python train.py --train_type ddpm --dataset_mode cifar10_mnist \
#       --output_dir outputs/ste_ddpm_cifar_mnist \
#       --batch_size 128 --epochs 100 --lr 2e-4 \
#       --ratios 0.5 0.5 --offset_mode explicit --offsets 0 1000 \
#       --num_train_timesteps 1000 --schedule_type linear \
#       --num_class_embeds 10 --save_every 20 --seed 42

train_type: ddpm
dataset_mode: cifar10_mnist
image_size: 32
batch_size: 128
epochs: 100
lr: 2.0e-4
ema_decay: 0.9999
ratios: [0.5, 0.5]
offset_mode: explicit
offsets: [0, 1000]
num_train_timesteps: 1000
schedule_type: linear
num_class_embeds: 10
save_every: 20
seed: 42
