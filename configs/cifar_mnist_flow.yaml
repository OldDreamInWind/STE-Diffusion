# STE flow-matching training: CIFAR-10 (primary) + MNIST (shadow)
# Equivalent CLI:
#   python train.py --train_type flow --dataset_mode cifar10_mnist \
#       --output_dir outputs/ste_flow_cifar_mnist \
#       --batch_size 128 --epochs 100 --lr 2e-4 \
#       --ratios 0.5 0.5 --shadow_bias 1.0 \
#       --num_class_embeds 10 --save_every 20

train_type: flow
dataset_mode: cifar10_mnist
image_size: 32
batch_size: 128
epochs: 100
lr: 2.0e-4
ema_decay: 0.9999
ratios: [0.5, 0.5]
shadow_bias: 1.0
num_class_embeds: 10
save_every: 20
seed: 42
